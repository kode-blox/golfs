apiVersion: v1
kind: Service
metadata:
  name: {{ include "golfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.kubernetesComponent }}
  {{- with .Values.publicService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.publicService.type }}
  ports:
    - port: {{ .Values.publicService.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "golfs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.kubernetesComponent }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "golfs.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.kubernetesComponent }}-metrics
  {{- with .Values.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metricsService.type }}
  ports:
    - port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "golfs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.kubernetesComponent }}
