{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "golfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golfs.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled=true" .Values.gateway.className }}
  listeners:
    {{- range $index, $entry := .Values.gateway.hosts }}
    - name: {{ printf "https-%d" $index }}
      protocol: HTTPS
      port: {{ $.Values.gateway.port }}
      hostname: {{ $entry.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "gateway.hosts[].tlsSecretName is required" $entry.tlsSecretName }}
    {{- end }}
{{- end }}
