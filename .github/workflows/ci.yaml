name: CI

on:
  workflow_call:
    outputs:
      application-version:
        description: Validated application version from the root VERSION file
        value: ${{ jobs.build-go.outputs.application-version }}

permissions: {}

jobs:
  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      application-version: ${{ steps.versions.outputs.application-version }}

    steps:
      - name: Checkout and install dependencies
        uses: SayakMukhopadhyay/github-actions/checkout-dependencies@v1
        with:
          go-version: '1.27.0'
          working-directory: .

      - name: Validate version metadata
        uses: SayakMukhopadhyay/github-actions/check-version@v1
        with:
          working-directory: .
          helm: 'true'

      - id: versions
        name: Read validated application version
        shell: bash
        run: printf 'application-version=%s\n' "$(<VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: test -z "$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/golfs

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  codeql:
    name: Analyze Go with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout and install dependencies
        uses: SayakMukhopadhyay/github-actions/checkout-dependencies@v1
        with:
          go-version: '1.27.0'
          working-directory: .

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Review Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  build-helm:
    name: Build Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Validate and package chart
        uses: SayakMukhopadhyay/github-actions/helm-package-push@v1
        with:
          app-version: build-${{ github.sha }}
          push: 'false'
          working-directory: .

      - name: Render chart
        run: |
          helm template golfs charts --set environmentsVars.GOLFS_GITHUB_APP_CLIENT_ID=Iv1_ci > /dev/null

      - name: Render optional chart features
        run: |
          helm template golfs charts \
            --set gateway.enabled=true \
            --set externalSecrets.enabled=true \
            --set externalSecrets.secretStore=ci-secret-store \
            --set externalSecrets.targetSecretName=golfs-ci \
            --set 'externalSecrets.secrets[0].secretKey=GOLFS_GITHUB_APP_PRIVATE_KEY_PEM' \
            --set 'externalSecrets.secrets[0].remoteRef.key=ci/golfs/github-app-private-key' \
            --set serviceMonitor.enabled=true \
            > /dev/null
