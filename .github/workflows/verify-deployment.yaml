name: Verify Deployment

on:
  workflow_call:
    inputs:
      expected-gitops-commit:
        description: GitOps commit expected to be synchronized by Argo CD
        required: true
        type: string
      deployment-environment:
        description: GitHub Environment containing the deployment configuration
        required: true
        type: string
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: GitHub App private key used to read the GitOps repository
        required: true
      ARGOCD_AUTH_TOKEN:
        description: Read-only Argo CD token supplied by the selected Environment
        required: false
      CF_ACCESS_CLIENT_ID:
        description: Cloudflare Access client ID supplied by the selected Environment
        required: false
      CF_ACCESS_CLIENT_SECRET:
        description: Cloudflare Access client secret supplied by the selected Environment
        required: false

permissions: {}

jobs:
  verify:
    name: Verify Argo CD synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: ${{ inputs.deployment-environment }}
      url: ${{ vars.URL }}
    permissions: {}

    steps:
      - id: gitops-token
        name: Create GitOps read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: SayakMukhopadhyay
          repositories: k8s-landscape-charts
          permission-contents: read

      - name: Verify deployment
        uses: SayakMukhopadhyay/github-actions/argocd-verify-deployment@v1
        with:
          server: ${{ vars.ARGOCD_SERVER }}
          application: ${{ vars.ARGOCD_APPLICATION }}
          auth-token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          cloudflare-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cloudflare-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          expected-commit-sha: ${{ inputs.expected-gitops-commit }}
          gitops-repository: SayakMukhopadhyay/k8s-landscape-charts
          gitops-token: ${{ steps.gitops-token.outputs.token }}
          timeout-seconds: '300'
