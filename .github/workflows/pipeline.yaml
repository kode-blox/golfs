name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.idea/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yaml

  validate-container:
    name: Validate Container
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs:
      - ci
    permissions:
      contents: read
    uses: $/.github/workflows/validate-container.yaml

  deliver-development:
    name: Deliver Development
    if: github.event_name == 'push'
    needs:
      - ci
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/deliver-development.yaml
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  release-eligibility:
    name: Release Eligibility
    needs:
      - deliver-development
    permissions:
      contents: read
    uses: $/.github/workflows/release-eligibility.yaml

  deliver-production:
    name: Deliver Production
    if: needs.release-eligibility.outputs.release-needed == 'true'
    needs:
      - deliver-development
      - release-eligibility
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/deliver-production.yaml
    with:
      source-digest: ${{ needs.deliver-development.outputs.image-digest }}
      application-release-needed: ${{ needs.release-eligibility.outputs.application-release-needed == 'true' }}
      chart-release-needed: ${{ needs.release-eligibility.outputs.chart-release-needed == 'true' }}
      application-version: ${{ needs.release-eligibility.outputs.application-version }}
      chart-version: ${{ needs.release-eligibility.outputs.chart-version }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  release-records:
    name: Create Release Records
    needs:
      - release-eligibility
      - deliver-production
    permissions:
      contents: write
    uses: $/.github/workflows/create-release-records.yaml
    with:
      application-release-needed: ${{ needs.release-eligibility.outputs.application-release-needed == 'true' }}
      chart-release-needed: ${{ needs.release-eligibility.outputs.chart-release-needed == 'true' }}
      application-version: ${{ needs.release-eligibility.outputs.application-version }}
      chart-version: ${{ needs.release-eligibility.outputs.chart-version }}
