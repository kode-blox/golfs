name: Deliver Production

on:
  workflow_call:
    inputs:
      source-digest:
        description: Development-verified image digest promoted without rebuilding
        required: true
        type: string
      application-release-needed:
        description: Whether the application release tag is pending
        required: true
        type: boolean
      chart-release-needed:
        description: Whether the chart release tag is pending
        required: true
        type: boolean
      application-version:
        description: Validated plain application version
        required: true
        type: string
      chart-version:
        description: Validated plain chart version
        required: true
        type: string
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: GitHub App private key used to read and update the GitOps repository
        required: true

permissions: {}

jobs:
  prepare-production:
    name: Prepare Production
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/prepare-production.yaml
    with:
      source-digest: ${{ inputs.source-digest }}
      application-release-needed: ${{ inputs.application-release-needed }}
      chart-release-needed: ${{ inputs.chart-release-needed }}
      application-version: ${{ inputs.application-version }}
      chart-version: ${{ inputs.chart-version }}

  deploy-production:
    name: Deploy Production
    needs:
      - prepare-production
    permissions:
      packages: read
    uses: $/.github/workflows/deploy.yaml
    with:
      deployment-environment: production
      chart-name: golfs
      chart-version: ${{ inputs.chart-release-needed && inputs.chart-version || '' }}
      image-tag: ${{ inputs.application-release-needed && inputs.application-version || '' }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  verify-production:
    name: Verify Production
    needs:
      - deploy-production
    permissions: {}
    uses: $/.github/workflows/verify-deployment.yaml
    with:
      expected-gitops-commit: ${{ needs.deploy-production.outputs.commit-sha }}
      deployment-environment: production
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
